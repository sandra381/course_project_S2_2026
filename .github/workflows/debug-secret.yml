name: Debug Secret Staging

# Workflow temporal SOLO para verificar el secret de staging.
# BORRAR este archivo una vez resuelto el problema.

on:
  pull_request:
    branches:
      - main

jobs:
  debug-secret:
    name: DEBUG Secret Staging
    runs-on: ubuntu-latest
    environment: staging          # NECESARIO para leer el secret del environment staging
    steps:
      - name: Verificar longitud y caracteres del password
        run: |
          PASS="${{ secrets.STAGING_DB_PASSWORD }}"
          echo "=================================================="
          echo "Longitud del STAGING_DB_PASSWORD: ${#PASS} caracteres"
          echo "=================================================="
          echo ""
          echo "Referencia:"
          echo "  StagingDB2026        = 13 caracteres"
          echo "  Spvr2026Stag#Secure! = 20 caracteres"
          echo ""
          if [ "${#PASS}" -eq 13 ]; then
            echo "RESULTADO: Longitud 13 — es 'StagingDB2026' (correcto)"
          elif [ "${#PASS}" -eq 20 ]; then
            echo "RESULTADO: Longitud 20 — es el password de Sandra con # y !"
          elif [ "${#PASS}" -eq 0 ]; then
            echo "RESULTADO: Longitud 0 — EL SECRET ESTA VACIO o no se esta leyendo"
          else
            echo "RESULTADO: Longitud ${#PASS} — password inesperado o con caracteres extra"
          fi
          echo ""
          echo "Primer caracter (hex): $(printf '%s' "${PASS:0:1}" | xxd -p)"
          echo "Ultimo caracter (hex):  $(printf '%s' "${PASS: -1}" | xxd -p)"
          echo "(20 = espacio, 0a = salto de linea, 09 = tab, vacio = secret no leido)"