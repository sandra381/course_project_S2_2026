name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: FORMAT CHECK ─────────────────────────────────────────────────────
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Terraform Format Check
        run: terraform fmt --check -recursive
        working-directory: infra/

  # ─── JOB 2: VALIDATE ─────────────────────────────────────────────────────────
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: fmt
    permissions:
      contents: read
      id-token: write  # requerido para OIDC token exchange
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Configure AWS Credentials — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/

  # ─── JOB 3a: PLAN — dev ───────────────────────────────────────────────────────
  # Job separado de staging porque cada uno necesita declarar su propio
  # "environment:" para poder leer su Environment secret correspondiente
  # (DEV_DB_PASSWORD vive en el ambiente "dev", no es un Repository secret).
  terraform-plan-dev:
    name: Terraform Plan — dev
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate
    environment: dev
    permissions:
      contents: read
      id-token: write  # requerido para OIDC token exchange
    outputs:
      plan-outcome: ${{ steps.plan-dev.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Configure AWS Credentials — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
      - name: Terraform Init — dev
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/

      # Nota: "exit ${PIPESTATUS[0]}" al final asegura que el step falle si
      # terraform plan falla, en vez de reportar éxito basándose en "tee"
      # (que casi siempre sale con código 0 sin importar lo que pasó antes).
      - name: Terraform Plan — dev
        id: plan-dev
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
        run: |
          terraform plan \
            -var-file=envs/dev/dev.tfvars \
            -out=tfplan-dev \
            -no-color 2>&1 | tee plan-dev.txt
          exit ${PIPESTATUS[0]}
        working-directory: infra/

      - name: Upload Plan Artifact — dev
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/tfplan-dev
          retention-days: 5

      - name: Upload Plan Text — dev
        uses: actions/upload-artifact@v4
        with:
          name: plan-text-dev
          path: infra/plan-dev.txt
          retention-days: 5

  # ─── JOB 3b: PLAN — staging ───────────────────────────────────────────────────
  terraform-plan-staging:
    name: Terraform Plan — staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate
    environment: staging-plan
    permissions:
      contents: read
      id-token: write  # requerido para OIDC token exchange
    outputs:
      plan-outcome: ${{ steps.plan-staging.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Configure AWS Credentials — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}

      - name: Terraform Init — staging
        run: terraform init -backend-config=envs/staging/backend-staging.hcl
        working-directory: infra/
      - name: Debug — Check Secret Length
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          echo "Largo de la contraseña: ${#TF_VAR_db_password} caracteres"    
      - name: Terraform Plan — staging
        id: plan-staging
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          terraform plan \
            -var-file=envs/staging/staging.tfvars \
            -out=tfplan-staging \
            -no-color 2>&1 | tee plan-staging.txt
          exit ${PIPESTATUS[0]}
        working-directory: infra/

      - name: Upload Plan Artifact — staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: infra/tfplan-staging
          retention-days: 5

      - name: Upload Plan Text — staging
        uses: actions/upload-artifact@v4
        with:
          name: plan-text-staging
          path: infra/plan-staging.txt
          retention-days: 5

  # ─── JOB 4: COMENTAR EL PLAN COMBINADO EN EL PR ──────────────────────────────
  post-plan-comment:
    name: Post Plan Comment
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [terraform-plan-dev, terraform-plan-staging]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download Plan Text — dev
        uses: actions/download-artifact@v4
        with:
          name: plan-text-dev
          path: dev-plan/
        continue-on-error: true

      - name: Download Plan Text — staging
        uses: actions/download-artifact@v4
        with:
          name: plan-text-staging
          path: staging-plan/
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planDev = 'No disponible';
            let planStaging = 'No disponible';
            try { planDev = fs.readFileSync('dev-plan/plan-dev.txt', 'utf8'); } catch (e) {}
            try { planStaging = fs.readFileSync('staging-plan/plan-staging.txt', 'utf8'); } catch (e) {}
            const combined = planDev + '\n\n--- STAGING ---\n\n' + planStaging;
            const truncated = combined.length > 60000
              ? combined.substring(0, 60000) + '\n\n... [output truncated] ...'
              : combined;
            const devOutcome     = '${{ needs.terraform-plan-dev.outputs.plan-outcome }}';
            const stagingOutcome = '${{ needs.terraform-plan-staging.outputs.plan-outcome }}';
            const icon = (devOutcome === 'success' && stagingOutcome === 'success') ? '✅' : '❌';
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## ${icon} Terraform Plan\n- dev: \`${devOutcome}\`\n- staging: \`${stagingOutcome}\`\n\n<details>\n<summary>Ver plan completo (dev + staging)</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>\n\n> Planes generados en commit \`${{ github.sha }}\``
            });
        continue-on-error: true

  # ─── APPLY DEV ───────────────────────────────────────────────────────────────
  terraform-apply-dev:
    name: Terraform Apply — dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      contents: read
      actions: read
      id-token: write  # requerido para OIDC token exchange
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Configure AWS Credentials — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/

      - name: Find PR Run ID
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha
            });
            const headSha = prs.data[0].head.sha;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terraform-ci.yml',
              event: 'pull_request',
              status: 'success',
              head_sha: headSha,
              per_page: 5
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('No se encontraron runs del PR exitosos');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            console.log('Run encontrado: ' + latest.id + ' SHA: ' + latest.head_sha);
            core.setOutput('run_id', latest.id.toString());

      - name: Download Plan Artifact — dev
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infra/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
        run: terraform apply tfplan-dev
        working-directory: infra/

  # ─── APPLY STAGING ───────────────────────────────────────────────────────────
  terraform-apply-staging:
    name: Terraform Apply — staging
    runs-on: ubuntu-latest
    needs: terraform-apply-dev
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write  # requerido para OIDC token exchange
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Configure AWS Credentials — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend-staging.hcl
        working-directory: infra/

      - name: Find PR Run ID
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha
            });
            const headSha = prs.data[0].head.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terraform-ci.yml',
              event: 'pull_request',
              status: 'success',
              head_sha: headSha,
              per_page: 5
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('No se encontraron runs del PR exitosos');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            console.log('Run encontrado: ' + latest.id + ' SHA: ' + latest.head_sha);
            core.setOutput('run_id', latest.id.toString());

      - name: Download Plan Artifact — staging
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infra/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.STAGING_DB_PASSWORD }}
        run: terraform apply tfplan-staging
        working-directory: infra/