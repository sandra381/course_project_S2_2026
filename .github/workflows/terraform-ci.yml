name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ─── PLAN ON PR ──────────────────────────────────────────────────────────────
  terraform-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Step 1 — Format check
      - name: Terraform Format Check
        run: terraform fmt --check -recursive
        working-directory: infra/

      # Step 2 — Init
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/

      # Step 3 — Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/

      # Step 4 — Plan (incluye network e ingress de D3)
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=envs/dev/dev.tfvars \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -no-color 2>&1 | tee plan.txt
        working-directory: infra/

      # Step 5 — Post plan as PR comment
      - name: Post Plan as PR Comment
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [output truncated] ...'
              : plan;

            const outcome = '${{ steps.plan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## ${icon} Terraform Plan — \`${outcome}\`

            <details>
            <summary>Click to expand full plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            > Plan generado desde \`infra/envs/dev/dev.tfvars\` en commit \`${{ github.sha }}\``
            });
        continue-on-error: true

  # ─── APPLY ON MERGE ──────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file=envs/dev/dev.tfvars \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -auto-approve
        working-directory: infra/