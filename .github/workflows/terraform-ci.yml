name: Terraform CI

on:
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Validate & Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write  # Required to post the plan as a PR comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 1 — Format check
      # Fails the PR if any .tf file deviates from canonical HCL style.
      # Fix locally with: terraform fmt -recursive
      - name: Terraform Format Check
        run: terraform fmt --check -recursive
        working-directory: infra/

      # Step 2 — Init (no remote backend)
      # Downloads provider plugins and verifies version constraints resolve.
      - name: Terraform Init
        run: terraform init -reconfigure 
        working-directory: infra/

      # Step 3 — Validate
      # Static analysis: catches type errors, missing variables, invalid arguments.
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/

      # Step 4 — Plan
      # Generates an execution plan against the AWS API using dev variables.
      # tee writes output to plan.txt for the comment step.
      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=envs/dev/dev.tfvars -no-color 2>&1 | tee plan.txt
        working-directory: infra/

      # Step 5 — Post plan as PR comment
      # Publishes the full plan in a collapsible <details> block.
      # Failure here is non-blocking (the plan step already passed).
      - name: Post Plan as PR Comment
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [output truncated] ...'
              : plan;

            const outcome = '${{ steps.plan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';

            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## ${icon} Terraform Plan — \`${outcome}\`

            <details>
            <summary>Click to expand full plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            > Plan generated from \`infra/envs/dev/dev.tfvars\` on commit \`${{ github.sha }}\``
            });
        continue-on-error: true  
