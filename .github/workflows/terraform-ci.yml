name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: FORMAT CHECK ─────────────────────────────────────────────────────
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - name: Terraform Format Check
        run: terraform fmt --check -recursive
        working-directory: infra/

  # ─── JOB 2: VALIDATE ─────────────────────────────────────────────────────────
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/
      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/

  # ─── JOB 3: PLAN (dev + staging) ─────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Plan dev ──────────────────────────────────────────────────────────────
      - name: Terraform Init — dev
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/

      - name: Terraform Plan — dev
        id: plan-dev
        run: |
          terraform plan \
            -var-file=envs/dev/dev.tfvars \
            -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
            -out=tfplan-dev \
            -no-color 2>&1 | tee plan-dev.txt
        working-directory: infra/

      - name: Upload Plan Artifact — dev
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/tfplan-dev
          retention-days: 5

      # ── Plan staging ──────────────────────────────────────────────────────────
      - name: Terraform Init — staging
        run: terraform init -reconfigure -backend-config=envs/staging/backend-staging.hcl
        working-directory: infra/

      - name: Terraform Plan — staging
        id: plan-staging
        run: |
          terraform plan \
            -var-file=envs/staging/staging.tfvars \
            -var="db_password=${{ secrets.STAGING_DB_PASSWORD }}" \
            -out=tfplan-staging \
            -no-color 2>&1 | tee plan-staging.txt
        working-directory: infra/

      - name: Upload Plan Artifact — staging
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: infra/tfplan-staging
          retention-days: 5

      # ── Comentario en el PR ───────────────────────────────────────────────────
      - name: Post Plan as PR Comment
        if: always() && steps.plan-dev.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planDev     = fs.readFileSync('infra/plan-dev.txt', 'utf8');
            const planStaging = fs.readFileSync('infra/plan-staging.txt', 'utf8');
            const combined = planDev + '\n\n--- STAGING ---\n\n' + planStaging;
            const truncated = combined.length > 60000
              ? combined.substring(0, 60000) + '\n\n... [output truncated] ...'
              : combined;
            const devOutcome     = '${{ steps.plan-dev.outcome }}';
            const stagingOutcome = '${{ steps.plan-staging.outcome }}';
            const icon = (devOutcome === 'success' && stagingOutcome === 'success') ? '✅' : '❌';
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## ${icon} Terraform Plan\n- dev: \`${devOutcome}\`\n- staging: \`${stagingOutcome}\`\n\n<details>\n<summary>Ver plan completo (dev + staging)</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>\n\n> Planes generados en commit \`${{ github.sha }}\``
            });
        continue-on-error: true

  # ─── APPLY DEV ───────────────────────────────────────────────────────────────
  # Busca el artifact por nombre de rama — funciona con squash merge y merge commit
  terraform-apply-dev:
    name: Terraform Apply — dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/dev/backend-dev.hcl
        working-directory: infra/

      # Busca el run del PR más reciente exitoso y baja el artifact
      - name: Find PR Run ID
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terraform-ci.yml',
              event: 'pull_request',
              status: 'success',
              per_page: 5
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('No se encontraron runs del PR exitosos');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            console.log('Run encontrado: ' + latest.id + ' SHA: ' + latest.head_sha);
            core.setOutput('run_id', latest.id.toString());

      - name: Download Plan Artifact — dev
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infra/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: Terraform Apply
        run: terraform apply tfplan-dev
        working-directory: infra/

  # ─── APPLY STAGING ───────────────────────────────────────────────────────────
  terraform-apply-staging:
    name: Terraform Apply — staging
    runs-on: ubuntu-latest
    needs: terraform-apply-dev
    environment: staging
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend-staging.hcl
        working-directory: infra/

      - name: Find PR Run ID
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terraform-ci.yml',
              event: 'pull_request',
              status: 'success',
              per_page: 5
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('No se encontraron runs del PR exitosos');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            console.log('Run encontrado: ' + latest.id + ' SHA: ' + latest.head_sha);
            core.setOutput('run_id', latest.id.toString());

      - name: Download Plan Artifact — staging
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: infra/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: Terraform Apply
        run: terraform apply tfplan-staging
        working-directory: infra/